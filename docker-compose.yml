services:
  dev:
    build:
      context: ./docker/
      dockerfile: Dockerfile
      tags:
        - cpu_sim_dev:latest
    # コンテナをホストと同じ UID/GID で実行し、バインドマウント越しの成果物が
    # ホストユーザー所有になるようにする。HOST_UID/HOST_GID は tool/rx-run.sh が
    # id -u / id -g から注入する(手動で docker compose を使う場合は 1000 固定)。
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    # 任意のホスト UID で実行すると passwd エントリが無く HOME が定まらないため固定する。
    # ./docker/claude_home を /home/ubuntu にバインドマウントするため、HOME もそこに合わせる
    # (claude code・bd の設定/認証情報や bash history 等がコンテナ再作成後も残る)。
    environment:
      HOME: /home/ubuntu
    # bd(beads)のDoltリモート接続に使う認証情報等、gitに含めたくない秘匿値を
    # 注入するための任意ファイル。存在しなくてもエラーにしない(required: false)。
    # ~/.bashrc等のシェル起動ファイルと違い、docker compose exec -T(非対話)
    # でも確実に環境変数として渡る。作り方は .env.dolt.example を参照。
    env_file:
      - path: ./.env.dolt
        required: false
    # claude code を対話的に使うため常駐させる。docker attach で入り、
    # detach しても中のプロセスは動き続ける(tty/stdin_open が必須)。
    tty: true
    stdin_open: true
    restart: unless-stopped
    # E2 Lite（Renesas VID 0x045B）を USB パススルーする。
    # /dev/bus/usb 全体をマウントし USB メジャー番号 189 を許可することで、
    # エミュレータの抜き差し（再列挙）でノード番号が変わっても追従できる。
    volumes:
      - .:/work
      - ./docker/claude_home:/home/ubuntu
      - /dev/bus/usb:/dev/bus/usb
    device_cgroup_rules:
      - 'c 189:* rmw'
